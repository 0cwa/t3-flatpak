name: Publish Flatpak Repo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-flatpak-repo
  cancel-in-progress: true

env:
  APP_ID: com.t3tools.t3code
  COLLECTION_ID: com.t3tools.t3code.Repository
  RUNTIME_REPO: https://flathub.org/repo/flathub.flatpakrepo

jobs:
  build:
    name: Build signed OSTree repo
    if: ${{ vars.PUBLISH_FLATPAK_REPO == 'true' || github.event_name == 'workflow_dispatch' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set stable build timestamp
        shell: bash
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          commit="$(git rev-parse --verify HEAD^{commit})"
          source_date_epoch="$(git show -s --format=%ct "$commit")"

          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo "Could not determine a numeric SOURCE_DATE_EPOCH for $commit." >&2
            exit 1
          fi

          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=$source_date_epoch from commit $commit."

      - name: Import Flatpak repository signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FLATPAK_GPG_PRIVATE_KEY:-}" ] || [ -z "${FLATPAK_GPG_KEY_ID:-}" ]; then
            echo "Set FLATPAK_GPG_PRIVATE_KEY and FLATPAK_GPG_KEY_ID secrets before publishing the Flatpak repository." >&2
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$FLATPAK_GPG_KEY_ID"
          gpg --batch --export "$FLATPAK_GPG_KEY_ID" | base64 --wrap=0 > "$RUNNER_TEMP/t3code-flatpak.gpg.b64"

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Restore previous Flatpak repo cache
        uses: actions/cache@v4
        with:
          path: site/repo
          key: flatpak-pages-repo-${{ github.run_id }}
          restore-keys: |
            flatpak-pages-repo-

      - name: Build Flatpak repository
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail

          flatpak remote-add --user --if-not-exists flathub "$RUNTIME_REPO"

          flatpak-builder --force-clean \
            --install-deps-from=flathub \
            --repo=site/repo \
            --collection-id="$COLLECTION_ID" \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            builddir \
            com.t3tools.t3code.yml

          flatpak build-update-repo \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --generate-static-deltas \
            --prune \
            --collection-id="$COLLECTION_ID" \
            --deploy-sideload-collection-id \
            --title="T3 Code" \
            --comment="Unofficial Flatpak repository for T3 Code" \
            --description="T3 Code packaged as a Flatpak from the upstream AppImage." \
            --homepage="https://github.com/$GITHUB_REPOSITORY" \
            site/repo

      - name: Generate Pages site
        env:
          FLATPAK_REPO_URL: ${{ vars.FLATPAK_REPO_URL }}
        shell: bash
        run: |
          set -euo pipefail

          site_dir="site"
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_url="${FLATPAK_REPO_URL:-}"

          if [ -z "$pages_url" ]; then
            if [ "$repo_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
              pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            else
              pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
            fi
          fi

          pages_url="${pages_url%/}"
          gpg_key="$(cat "$RUNNER_TEMP/t3code-flatpak.gpg.b64")"
          escaped_pages_url="$(printf '%s' "$pages_url" | sed 's/[&|\\]/\\&/g')"
          escaped_repository="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/[&|\\]/\\&/g')"
          escaped_gpg_key="$(printf '%s' "$gpg_key" | sed 's/[&|\\]/\\&/g')"

          sed \
            -e "s|@FLATPAK_REPO_URL@|$escaped_pages_url|g" \
            -e "s|@GITHUB_REPOSITORY@|$escaped_repository|g" \
            -e "s|@GPG_KEY@|$escaped_gpg_key|g" \
            t3code.flatpakrepo.in > "$site_dir/t3code.flatpakrepo"

          sed \
            -e "s|@FLATPAK_REPO_URL@|$escaped_pages_url|g" \
            -e "s|@GITHUB_REPOSITORY@|$escaped_repository|g" \
            -e "s|@GPG_KEY@|$escaped_gpg_key|g" \
            t3code.flatpakref.in > "$site_dir/t3code.flatpakref"

          {
            printf '%s\n' '<!doctype html>'
            printf '%s\n' '<html lang="en">'
            printf '%s\n' '<head>'
            printf '%s\n' '  <meta charset="utf-8">'
            printf '%s\n' '  <meta name="viewport" content="width=device-width, initial-scale=1">'
            printf '%s\n' '  <title>T3 Code Flatpak Repo</title>'
            printf '%s\n' '</head>'
            printf '%s\n' '<body>'
            printf '%s\n' '  <h1>T3 Code Flatpak Repo</h1>'
            printf '%s\n' '  <p><a href="t3code.flatpakrepo">Add the T3 Code Flatpak remote</a></p>'
            printf '%s\n' '  <p><a href="t3code.flatpakref">Install T3 Code from this remote</a></p>'
            printf '%s\n' '  <pre>flatpak remote-add --user --if-not-exists t3code '"${pages_url}"'/t3code.flatpakrepo'
            printf '%s\n' 'flatpak install --user t3code com.t3tools.t3code'
            printf '%s\n' 'flatpak update --user com.t3tools.t3code</pre>'
            printf '%s\n' '</body>'
            printf '%s\n' '</html>'
          } > "$site_dir/index.html"

      - name: Verify Pages payload
        shell: bash
        run: |
          set -euo pipefail

          test -s site/repo/summary
          test -s site/repo/summary.sig
          test -s site/t3code.flatpakrepo
          test -s site/t3code.flatpakref

          if find site -type l -print -quit | grep -q .; then
            echo "GitHub Pages artifacts must not contain symlinks." >&2
            exit 1
          fi

          grep -Eq '^Url=https://[^[:space:]]+/repo/$' site/t3code.flatpakrepo
          grep -Eq '^GPGKey=[A-Za-z0-9+/=]+$' site/t3code.flatpakrepo
          grep -Eq '^Name=com\.t3tools\.t3code$' site/t3code.flatpakref
          grep -Eq '^RuntimeRepo=https://flathub\.org/repo/flathub\.flatpakrepo$' site/t3code.flatpakref

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
