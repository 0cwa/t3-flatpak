name: Update Bundled Runtime Pins

on:
  schedule:
    - cron: "35 7 * * 1"
  workflow_dispatch:
    inputs:
      allow_major:
        description: "Allow major version changes for Node.js, Git, or OpenSSH"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check bundled runtime pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update bundled runtime pins
        id: update
        env:
          ALLOW_MAJOR: ${{ inputs.allow_major || false }}
        run: node scripts/update-bundled-runtime-pins.js

      - name: Validate updater and launcher scripts
        run: |
          set -euo pipefail
          node --check scripts/update-bundled-runtime-pins.js
          node --check scripts/update-t3code-appimage.js
          bash -n startt3code
          bash -n t3code-install-provider
          git diff --check -- com.t3tools.t3code.yml scripts/update-bundled-runtime-pins.js

      - name: Create update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          NODE_VERSION: ${{ steps.update.outputs.node }}
          GIT_VERSION: ${{ steps.update.outputs.git }}
          OPENSSH_VERSION: ${{ steps.update.outputs.openssh }}
        run: |
          set -euo pipefail

          branch="chore/update-bundled-runtime-pins"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add com.t3tools.t3code.yml
          git commit -m "chore: update bundled runtime pins"
          git push --force-with-lease origin "$branch"

          body="$(printf 'Updates bundled runtime source pins for the T3 Code Flatpak.\n\n- Node.js: %s\n- Git: %s\n- OpenSSH: %s\n\nThis workflow keeps updates separate from upstream T3 Code AppImage repinning.' "$NODE_VERSION" "$GIT_VERSION" "$OPENSSH_VERSION")"

          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" \
              --title "chore: update bundled runtime pins" \
              --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore: update bundled runtime pins" \
              --body "$body"
          fi
