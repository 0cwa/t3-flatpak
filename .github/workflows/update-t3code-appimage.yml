name: Update T3 Code AppImage

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-t3code-appimage
  cancel-in-progress: false

jobs:
  update:
    name: Check latest upstream AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update manifest pins
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-t3code-appimage.js

      - name: Commit update and tag release
        id: publish
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          case "$VERSION" in
            v*) tag="t3code-${VERSION}" ;;
            *) tag="t3code-v${VERSION}" ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- com.t3tools.t3code.yml; then
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Manifest already points at T3 Code ${VERSION}, and release tag ${tag} already exists."
              exit 0
            fi

            echo "Manifest already points at T3 Code ${VERSION}; creating missing release tag ${tag}."
            git tag -a "$tag" -m "T3 Code ${VERSION}"
            git push origin "$tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists." >&2
            exit 1
          fi

          git add com.t3tools.t3code.yml
          git commit -m "chore: update T3 Code AppImage to ${VERSION}"
          git tag -a "$tag" -m "T3 Code ${VERSION}"
          git push origin HEAD:main
          git push origin "$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch downstream workflows for the default token
        if: steps.publish.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
          UPDATED: ${{ steps.publish.outputs.updated }}
        run: |
          set -euo pipefail
          # PAT pushes trigger workflows automatically; GITHUB_TOKEN pushes do not.
          if [ -n "$CUSTOM_TOKEN" ]; then
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"
          if [ "$UPDATED" = true ]; then
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
            gh workflow run pages-flatpak-repo.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
