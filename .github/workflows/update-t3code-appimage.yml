name: Update T3 Code AppImage

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-t3code-appimage
  cancel-in-progress: false

jobs:
  update:
    name: Check latest upstream AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update manifest pins
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-t3code-appimage.js

      - name: Commit update and tag release
        id: publish
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          case "$VERSION" in
            v*) tag="t3code-${VERSION}" ;;
            *) tag="t3code-v${VERSION}" ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- com.t3tools.t3code.yml; then
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Manifest already points at T3 Code ${VERSION}, and release tag ${tag} already exists."
              exit 0
            fi

            echo "Manifest already points at T3 Code ${VERSION}; creating missing release tag ${tag}."
            git tag -a "$tag" -m "T3 Code ${VERSION}"
            git push origin "$tag"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists." >&2
            exit 1
          fi

          git add com.t3tools.t3code.yml
          git commit -m "chore: update T3 Code AppImage to ${VERSION}"
          git tag -a "$tag" -m "T3 Code ${VERSION}"
          # Publish both refs together so a rejected tag cannot strand main.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"

      - name: Reconcile downstream workflows for the default token
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
          PUBLISH_FLATPAK_REPO: ${{ vars.PUBLISH_FLATPAK_REPO }}
        run: |
          set -euo pipefail
          # PAT pushes trigger workflows automatically; GITHUB_TOKEN pushes do not.
          if [ -n "$CUSTOM_TOKEN" ]; then
            exit 0
          fi

          # Existing tags also reach this step: retry a missing dispatch after a
          # partial failure without repeating requests that already created runs.
          dispatch_if_missing() {
            local workflow="$1" ref="$2" sha="$3" runs
            shift 3
            runs="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$sha" -f per_page=100 --paginate \
              | jq --arg ref "$ref" -r '.workflow_runs[] |
                  select(.head_branch == $ref and
                    (.event == "push" or .event == "workflow_dispatch")) | .id')"
            if [ -n "$runs" ]; then
              echo "$workflow already has a run for $ref ($sha); rerun it in Actions if needed."
              return
            fi
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$ref" "$@"
          }

          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          main_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          dispatch_if_missing release.yml "$RELEASE_TAG" "$release_sha" -f tag="$RELEASE_TAG"
          dispatch_if_missing build.yml main "$main_sha"
          dispatch_if_missing security-baseline.yml main "$main_sha"
          if [ "$PUBLISH_FLATPAK_REPO" = true ]; then
            dispatch_if_missing pages-flatpak-repo.yml main "$main_sha"
          fi
