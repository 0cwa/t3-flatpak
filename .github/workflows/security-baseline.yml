name: Flatpak permission regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checker dependency
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-security.txt
      - name: Test permission checker
        run: python -m unittest discover -s tests -p test_flatpak_security.py
      - name: Check default permissions and launcher
        run: python scripts/check-flatpak-security.py
      - name: Check launcher syntax
        run: bash -n startt3code
