app-id: com.t3tools.t3code

runtime: org.freedesktop.Platform
runtime-version: &runtime-version '26.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version

command: startt3code
branch: master
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.Flatpak
  - --env=GTK_USE_PORTAL=1
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons # This is used to show the correct cursor on Wayland
  # Without home access, $HOME inside the sandbox is a tmpfs that is discarded
  # on exit. Map app state dirs that ignore XDG onto persistent app storage;
  # expose only selected host tool/key directories, and only read-only.
  - --persist=.t3 # T3 Code settings, state DB, auth tokens, secrets, worktrees
  - --persist=.codex # Codex CLI
  - --persist=.claude # Claude Code (startt3code points CLAUDE_CONFIG_DIR here)
  - --filesystem=~/.ssh:ro
  - --filesystem=~/.gnupg:ro
  - --filesystem=~/.local/bin:ro

modules:
  - name: nodejs
    buildsystem: simple
    build-commands:
      - install -d /app/lib/nodejs /app/bin
      - cp -a . /app/lib/nodejs
      - ln -s ../lib/nodejs/bin/node /app/bin/node
      - ln -s ../lib/nodejs/bin/npm /app/bin/npm
      - ln -s ../lib/nodejs/bin/npx /app/bin/npx
      - ln -s ../lib/nodejs/bin/corepack /app/bin/corepack
    sources:
      - type: archive
        url: https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
        sha256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
        only-arches: [x86_64]

  - name: git
    buildsystem: simple
    build-commands:
      - make prefix=/app NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PERL=YesPlease NO_RUST=YesPlease all
      - make prefix=/app NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PERL=YesPlease NO_RUST=YesPlease install
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz
        sha256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3

  - name: gh
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/gh /app/bin/gh
    sources:
      - type: archive
        url: https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
        sha256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
        only-arches: [x86_64]

  - name: glab
    buildsystem: simple
    build-commands:
      - install -Dm755 "$(find . -type f -name glab -print -quit)" /app/bin/glab
    sources:
      - type: archive
        url: https://gitlab.com/gitlab-org/cli/-/releases/v1.120.0/downloads/glab_1.120.0_linux_amd64.tar.gz
        sha256: 4e6c59de9f7ed2f304bf93aad01ea8f8a69584f0450ce90ad696ef81f69c69aa
        only-arches: [x86_64]

  - name: tea
    buildsystem: simple
    build-commands:
      - install -Dm755 tea-0.16.0-linux-amd64 /app/bin/tea
    sources:
      - type: file
        url: https://gitea.com/gitea/tea/releases/download/v0.16.0/tea-0.16.0-linux-amd64
        dest-filename: tea-0.16.0-linux-amd64
        sha256: 9c142c8a0b31485eea2387031c1c404f12b7141075eb4ffbd7ced49441590636
        only-arches: [x86_64]

  - name: openssh
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --sysconfdir=/app/etc/ssh --with-privsep-path=/app/var/empty --without-pam
      - make ssh scp sftp ssh-add ssh-agent ssh-keygen ssh-keyscan
      - install -d /app/bin /app/etc/ssh
      - install -m755 ssh scp sftp ssh-add ssh-agent ssh-keygen ssh-keyscan /app/bin
      - install -m644 ssh_config /app/etc/ssh/ssh_config
    sources:
      - type: archive
        url: https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.5p1.tar.gz
        sha256: d44d28a839ea9daf969cc69150fde59910b2b39361dad81a3bd6cbd19218db11

  - name: t3code
    buildsystem: simple
    build-commands:
      - chmod +x T3-Code.AppImage
      - ./T3-Code.AppImage --appimage-extract
      - find squashfs-root -type f \( -name app-update.yml -o -name dev-app-update.yml \) -delete
      - |
        if find squashfs-root -type f \( -name app-update.yml -o -name dev-app-update.yml \) -print -quit | grep -q .; then
          echo "Unexpected Electron updater metadata remains in extracted AppImage." >&2
          exit 1
        fi
      # Upstream calls app.setDesktopName("com.t3tools.T3Code.desktop"), which
      # Electron also uses as the Wayland app_id. Flatpak can only export
      # com.t3tools.t3code.desktop, so compositors cannot match the window to the
      # installed desktop entry. Rewrite the name in place: both strings have the
      # same length, so asar header offsets stay valid. Refuse to patch if the
      # string moved or if Electron's embedded asar integrity fuse is enabled.
      - |
        asar=squashfs-root/resources/app.asar
        old='com.t3tools.T3Code.desktop'
        new='com.t3tools.t3code.desktop'
        sentinel='dL7pKGdnNz796PbbjQWNKmHXBZaB9tsX'
        fuse_offset=$(grep -aobF "$sentinel" squashfs-root/t3code | head -n1 | cut -d: -f1)
        if [ -z "$fuse_offset" ]; then
          echo "Electron fuse sentinel not found in t3code binary." >&2
          exit 1
        fi
        integrity_fuse=$(dd if=squashfs-root/t3code bs=1 skip=$((fuse_offset + ${#sentinel} + 2 + 4)) count=1 status=none)
        if [ "$integrity_fuse" = 1 ]; then
          echo "EnableEmbeddedAsarIntegrityValidation is on; cannot patch app.asar." >&2
          exit 1
        fi
        if [ "$(grep -aoF "$old" "$asar" | wc -l)" -ne 1 ]; then
          echo "Expected exactly one '$old' in app.asar." >&2
          exit 1
        fi
        sed -i "s/com\.t3tools\.T3Code\.desktop/$new/g" "$asar"
        test "$(grep -aoF "$old" "$asar" | wc -l)" -eq 0
        test "$(grep -aoF "$new" "$asar" | wc -l)" -eq 1
      - desktop-file-edit --set-key="Exec" --set-value="startt3code %U" --set-icon=$FLATPAK_ID
        --add-mime-type=x-scheme-handler/t3code
        --remove-mime-type=x-scheme-handler/t3code-dev
        squashfs-root/t3code.desktop
      - |
        for icon in 16 22 24 32 48 64 128 256 512; do
          install -D squashfs-root/usr/share/icons/hicolor/${icon}x${icon}/apps/t3code.png \
              /app/share/icons/hicolor/${icon}x${icon}/apps/com.t3tools.t3code.png
        done
      - install -D squashfs-root/t3code.desktop /app/share/applications/com.t3tools.t3code.desktop
      - install -Dm755 startt3code /app/bin/startt3code
      - install -Dm755 t3code-install-provider /app/bin/t3code-install-provider
      - install -D com.t3tools.t3code.metainfo.xml -t /app/share/metainfo/
      - mv squashfs-root /app/bin/t3code

    sources:
      - type: file
        path: startt3code
      - type: file
        path: t3code-install-provider

      - type: file
        path: com.t3tools.t3code.metainfo.xml

      - type: file
        url: https://github.com/pingdotgg/t3code/releases/download/v0.1.0/T3-Code-0.1.0-x86_64.AppImage
        dest-filename: T3-Code.AppImage
        sha256: e38d9c5fb513b1ece0a708b906d3383b5b47ed199575b39a31e41ab8834eb744
        only-arches: [x86_64]
        x-checker-data:
          type: electron-updater
          url: https://github.com/pingdotgg/t3code/releases/latest/download/latest-linux.yml
